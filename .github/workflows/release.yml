name: Release

# Publishing happens only from `main`, which changes only through reviewed PRs.
# Triggering on the branch (not on tags) means the workflow that publishes is
# always main's own copy: a tag-triggered run would execute whatever workflow
# file the tagged commit carries, so a tag on an unreviewed branch could publish.
#
# To release: bump `version` in package.json (and CHANGELOG.md) in a PR and
# merge it. A merge that does not change the version publishes nothing.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Is this version unpublished?
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - id: version
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A 404 means "not published yet"; any other npm failure must stop the
          # release rather than be mistaken for it.
          if out=$(npm view "$name@$version" version 2>&1); then
            echo "$name@$version is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif grep -q E404 <<<"$out"; then
            echo "$name@$version is not on npm yet; publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "$out"
            exit 1
          fi

  # The full CI workflow — typecheck, all tests including Mastra's conformance
  # suites on both Node versions, build checks, tarball assertions — must pass
  # on the exact commit being published.
  ci:
    name: CI
    needs: check
    if: needs.check.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: [check, ci]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Restrict this environment to the `main` branch in the repository settings
    # and scope the npm trusted publisher to it, so neither GitHub nor npm will
    # accept a publish from any other ref.
    environment: npm
    permissions:
      # Creates the v<version> tag and GitHub release after publishing.
      contents: write
      # Short-lived OIDC token for npm trusted publishing; no NPM_TOKEN is stored.
      id-token: write
    steps:
      - name: Refuse anything but main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Publishing is only allowed from main; this run is on $GITHUB_REF."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 24 ships npm >= 11.5.1, which trusted publishing requires. No
      # dependency cache here: a cache written by an unprivileged run must not
      # reach the one job that can publish.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: npm ci --ignore-scripts
      - run: npm run build

      # Pack once and publish that exact tarball, so what was built and checked
      # is what ships. Provenance is attached automatically by trusted publishing.
      - name: Pack
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"

      - name: Publish
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=("$RUNNER_TEMP"/package/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one tarball, found ${#tarballs[@]}."
            exit 1
          fi
          npm publish "${tarballs[0]}" --access public

      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
